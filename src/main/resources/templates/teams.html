{#include base.html}
    <h2 class="mb-4">Teams</h2>
    <div class="row">
        {#for team in teams}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{team.name}</h5>
                    <p class="card-text">Owner: {team.ownerId}</p>
                    <p class="card-text"><small class="text-muted">{team.memberIds.size()} members</small></p>
                    <a href="/ui/teams/{team.id}/projects" class="btn btn-primary btn-sm">View Projects</a>
                </div>
            </div>
        </div>
        {/for}
    </div>
{/include}
